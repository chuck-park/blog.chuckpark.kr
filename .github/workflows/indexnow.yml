name: IndexNow & Search Engine Ping

on:
  push:
    branches:
      - main
    paths:
      - '_posts/**'
      - 'sitemap.xml'
  workflow_dispatch:

jobs:
  ping-search-engines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Ping IndexNow (Bing, Naver, Yandex, etc.)
        run: |
          KEY="e3b0c44298fc1c149afbf4c8996fb924"
          HOST="blog.chuckpark.kr"

          echo "Submitting sitemap to IndexNow..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{
              \"host\": \"$HOST\",
              \"key\": \"$KEY\",
              \"keyLocation\": \"https://$HOST/$KEY.txt\",
              \"urlList\": [
                \"https://$HOST/\",
                \"https://$HOST/sitemap.xml\"
              ]
            }")

          echo "IndexNow response status: $HTTP_STATUS"
